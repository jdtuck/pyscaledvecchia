[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaled-vecchia"
version = "0.1.0"
description = "Scaled Vecchia approximation for fast Gaussian-process computer-model emulation (Katzfuss, Guinness & Lawrence, 2020/2022)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["gaussian-process", "vecchia", "emulation", "spatial-statistics", "kriging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "numba>=0.58",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
demo = ["matplotlib"]

[project.urls]
Homepage = "https://arxiv.org/abs/2005.00386"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
